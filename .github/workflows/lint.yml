name: Lint

on:
  push:
    branches: [main]
    paths: &code
      - go.mod
      - go.sum
      - api/**
      - cmd/**
      - internal/**
      - test/**
      - examples/**
      - config/**
      - hack/**
      - tools/**
      - .regal/**
      - Makefile
      - Dockerfile
      - docker-bake.hcl
      - .dockerignore
      - .golangci.yml
      - .custom-gcl.yml
      - .github/workflows/**
  pull_request:
    paths: *code
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The linter's plugins build only with Go 1.27, though the module targets 1.26.
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Check linter configuration
        run: make lint-config
      - name: Validate
        run: make validate
