name: E2E Tests

on:
  push:
    branches: [main]
    paths: &code
      - go.mod
      - go.sum
      - api/**
      - cmd/**
      - internal/**
      - test/**
      - examples/**
      - config/**
      - hack/**
      - tools/**
      - .regal/**
      - Makefile
      - Dockerfile
      - docker-bake.hcl
      - .dockerignore
      - .golangci.yml
      - .custom-gcl.yml
      - .github/workflows/**
  pull_request:
    paths: *code
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: E2E (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.36"
            node-image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Running Test e2e
        env:
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make test-e2e

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.kubernetes }}
          path: artifacts/
          if-no-files-found: ignore
