{{- if and .Values.prometheus.enabled .Values.prometheus.scrapeEngines }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "common.fullname" . }}-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    {{- with .Values.controlNamespaces }}
    matchNames:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    any: true
    {{- end }}
  podMetricsEndpoints:
    - path: /metrics
      port: diagnostic
      scheme: http
  selector:
    matchLabels:
      app.kubernetes.io/component: engine
      app.kubernetes.io/managed-by: k8s-authz-operator
{{- end }}
