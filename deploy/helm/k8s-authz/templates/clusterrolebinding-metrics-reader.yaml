{{- if and .Values.rbac.create .Values.metrics.enabled .Values.metrics.reader.subjects -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.fullname" . }}-metrics-reader
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.fullname" . }}-metrics-reader
subjects:
  {{- toYaml .Values.metrics.reader.subjects | nindent 2 }}
{{- end }}
