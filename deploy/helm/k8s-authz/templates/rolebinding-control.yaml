{{- if .Values.rbac.create }}
  {{- range .Values.controlNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.fullname" $ }}-control
  namespace: {{ . }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.fullname" $ }}-control
subjects:
  {{- include "k8s-authz.serviceAccountSubject" $ | nindent 2 }}
  {{- end }}
{{- end }}
