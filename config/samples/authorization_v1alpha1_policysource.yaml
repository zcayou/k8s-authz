apiVersion: authorization.zctx.io/v1alpha1
kind: PolicySource
metadata:
  labels:
    app.kubernetes.io/name: k8s-authz
    app.kubernetes.io/managed-by: kustomize
  namespace: k8s-authz-system
  name: policysource-sample
spec:
  provider:
    type: Kubernetes
  collection:
    - kinds:
        - Policy
        - PolicyBinding
        - PolicySet
      namespaces:
        - k8s-authz-system
      names:
        - '*'
  rego: {}
