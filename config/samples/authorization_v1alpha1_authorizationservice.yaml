apiVersion: authorization.zctx.io/v1alpha1
kind: AuthorizationService
metadata:
  labels:
    app.kubernetes.io/name: k8s-authz
    app.kubernetes.io/managed-by: kustomize
  namespace: k8s-authz-system
  name: authorizationservice-sample
spec:
  program:
    type: Kubernetes
  runtime:
    type: Deployment
  tls:
    server:
      secretRef:
        name: authorizationservice-sample-server-tls
      caRef:
        secretKeyRef:
          name: authorizationservice-sample-serving-ca
          key: ca.crt
    client:
      caRef:
        secretKeyRef:
          name: authorizationservice-sample-client-ca
          key: ca.crt
  endpoints:
    - name: sample
      callers:
        - commonName: kube-apiserver
      sourceRefs:
        - namespace: k8s-authz-system
          name: policysource-sample
      whenEvaluationFails: NoOpinion
      authorities:
        - bindingRef:
            sourceRef:
              namespace: k8s-authz-system
              name: policysource-sample
            namespace: k8s-authz-system
            name: policybinding-sample
          whenNoPolicyAllows: NoOpinion
