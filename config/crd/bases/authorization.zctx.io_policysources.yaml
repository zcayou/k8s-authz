            properties:
              conditions:
                description: |-
                  conditions holds Synchronized, which reports whether the latest acquisition
                  is complete.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              issues:
                description: |-
                  issues contains bounded attributed diagnostics for the documents
                  in the source's view.
                items:
                  description: Issue is a bounded diagnostic projected into control-resource
                    status.
                  properties:
                    authority:
                      description: authority identifies an affected authority when
                        known.
                      type: string
                    contextID:
                      description: contextID identifies one contextual graph use when
                        known.
                      type: string
                    documentRef:
                      description: documentRef identifies an affected document when
                        known.
                      properties:
                        group:
                          description: group is the canonical API group.
                          type: string
                        kind:
                          description: kind is the canonical kind.
                          type: string
                        name:
                          description: name is the document name.
                          type: string
                        namespace:
                          description: namespace is present for namespaced document
                            kinds.
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    endpoint:
                      description: endpoint identifies an affected endpoint when known.
                      type: string
                    message:
                      description: message is a human-readable diagnostic.
                      type: string
                    path:
                      description: path is the ordered qualified ancestry for a contextual
                        use.
                      items:
                        description: QualifiedDocumentRef identifies a document in
                          status diagnostics.
                        properties:
                          group:
                            description: group is the canonical API group.
                            type: string
                          kind:
                            description: kind is the canonical kind.
                            type: string
                          name:
                            description: name is the document name.
                            type: string
                          namespace:
                            description: namespace is present for namespaced document
                              kinds.
                            type: string
                        required:
                        - group
                        - kind
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    reason:
                      description: reason is a stable machine-readable reason.
                      type: string
                    scope:
                      description: scope identifies the diagnostic attribution level.
                      enum:
                      - Document
                      - Use
                      type: string
                    severity:
                      description: severity is Error or Warning.
                      enum:
                      - Error
                      - Warning
                      type: string
                    sourceRef:
                      description: sourceRef identifies the source of the affected
                        document when known.
                      properties:
                        name:
