  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: policysources.authorization.zctx.io
spec:
  group: authorization.zctx.io
  names:
    categories:
    - authz
    kind: PolicySource
    listKind: PolicySourceList
    plural: policysources
    shortNames:
    - azsrc
    singular: policysource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synchronized")].status
      name: Synchronized
      type: string
    - jsonPath: .status.lastAdmittedTime
      name: LastAdmitted
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PolicySource registers an acquired policy-document source.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines source acquisition.
            properties:
              collection:
                description: collection contains the explicit ranges collected by
                  this source.
                items:
                  description: |-
                    KeyRange selects policy documents to collect from a source. Cluster-scoped
                    kinds omit namespaces; every other kind requires them.
                  properties:
                    kinds:
                      description: kinds are the canonical kinds included in the range.
                      items:
                        enum:
                        - Policy
                        - PolicyBinding
                        - PolicySet
                        - Role
                        - ClusterRole
                        - RoleBinding
                        - ClusterRoleBinding
                        type: string
                      maxItems: 256
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    names:
                      description: |-
                        names are the document names included in the range. "*" selects every
                        name.
                      items:
                        maxLength: 253
                        minLength: 1
                        type: string
                      maxItems: 256
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    namespaces:
                      description: |-
                        namespaces are the logical namespaces included in the range. "*" selects
                        every namespace.
                      items:
                        maxLength: 63
                        pattern: ^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                        type: string
                      maxItems: 256
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - kinds
                  - names
                  type: object
                  x-kubernetes-validations:
                  - message: kinds must be all cluster-scoped or all namespaced
                    rule: self.kinds.all(k, k in ['ClusterRole', 'ClusterRoleBinding'])
                      || self.kinds.all(k, !(k in ['ClusterRole', 'ClusterRoleBinding']))
                  - message: namespaces is required for namespaced kinds and forbidden
                      for cluster-scoped kinds
                    rule: self.kinds.all(k, k in ['ClusterRole', 'ClusterRoleBinding'])
                      != has(self.namespaces)
                  - message: the namespaces wildcard must stand alone
                    rule: '!has(self.namespaces) || !(''*'' in self.namespaces) ||
                      size(self.namespaces) == 1'
                  - message: the names wildcard must stand alone
                    rule: '!(''*'' in self.names) || size(self.names) == 1'
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              contribution:
                default: Active
                description: |-
                  contribution selects whether the source's documents take part in compiled
                  policy. Toggling it never restarts acquisition.
                enum:
                - Active
                - Inert
                type: string
              provider:
                description: provider selects and configures the acquisition provider.
                properties:
                  kubernetes:
                    description: kubernetes configures acquisition from a Kubernetes
                      API.
                    properties:
                      kubeconfig:
                        description: |-
                          kubeconfig selects an explicit kubeconfig credential. Omission reads
                          from the operator's own cluster with the operator's credentials.
                        properties:
                          secretRef:
                            description: secretRef identifies the Secret data containing
                              the kubeconfig.
                            properties:
                              key:
                                description: key is the Secret data key.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name is the Secret name.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - secretRef
                        type: object
                    type: object
                  type:
                    description: type identifies the selected provider.
                    enum:
                    - Kubernetes
                    type: string
                required:
                - type
                type: object
              rego:
                description: |-
                  rego allows the source's documents to carry Rego conditions. Omission
