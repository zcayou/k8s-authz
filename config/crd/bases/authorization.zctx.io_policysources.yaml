                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        namespace:
                          description: namespace is the PolicySource namespace.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                  required:
                  - message
                  - reason
                  - scope
                  - severity
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              issuesTruncated:
                description: issuesTruncated reports that additional diagnostics were
                  omitted.
                type: boolean
              lastAdmittedTime:
                description: |-
                  lastAdmittedTime records when the source last admitted a complete view
                  whose documents changed, or which ended a period of failed acquisition.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation assessed by
                  this status.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
