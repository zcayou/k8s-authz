---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: policybindings.authorization.zctx.io
spec:
  group: authorization.zctx.io
  names:
    categories:
    - authz
    kind: PolicyBinding
    listKind: PolicyBindingList
    plural: policybindings
    shortNames:
    - azpb
    singular: policybinding
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PolicyBinding attaches principals to a Policy, PolicySet, or
          native role definition.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the principal binding.
            properties:
              constraints:
                description: constraints narrows the target and its descendants.
                properties:
                  maxDepth:
                    description: maxDepth caps further PolicySet edges below the target.
                    format: int32
                    maximum: 64
                    minimum: 0
                    type: integer
                  policyRef:
                    description: policyRef supplies a leaf permission bound.
                    properties:
                      apiGroup:
                        description: |-
                          apiGroup is the referenced kind's API group. It is derived from kind when
                          omitted.
                        maxLength: 253
                        type: string
                      kind:
                        description: kind is Policy, PolicySet, Role, or ClusterRole.
                          Omission means Policy.
                        enum:
                        - Policy
                        - PolicySet
                        - Role
                        - ClusterRole
                        type: string
                      name:
                        description: name is the referenced permission definition's
                          name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          namespace is the logical namespace of a namespaced definition. Omission
                          means the referencing document's namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      sourceRef:
                        description: sourceRef selects another allowed PolicySource.
                        properties:
                          name:
                            description: name is the PolicySource name.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            description: namespace is the PolicySource namespace.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: apiGroup must match kind
                      rule: '!has(self.apiGroup) || self.apiGroup == (has(self.kind)
                        && self.kind in [''Role'', ''ClusterRole''] ? ''rbac.authorization.k8s.io''
                        : ''authorization.zctx.io'')'
                    - message: namespace is forbidden for ClusterRole
                      rule: '!(has(self.kind) && self.kind == ''ClusterRole'') ||
                        !has(self.namespace)'
                    - message: a reference into another source requires namespace
                      rule: '!has(self.sourceRef) || has(self.namespace) || (has(self.kind)
                        && self.kind == ''ClusterRole'')'
                  sourceRefs:
                    description: |-
                      sourceRefs narrows the incoming sources for a PolicySet target. It must
                      include the target's own source.
                    items:
                      description: SourceRef identifies a PolicySource in the trusted
                        control API.
                      properties:
                        name:
                          description: name is the PolicySource name.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        namespace:
                          description: namespace is the PolicySource namespace.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - namespace
                    - name
                    x-kubernetes-list-type: map
                type: object
                x-kubernetes-validations:
                - message: constraints.policyRef must target a leaf policy
                  rule: '!has(self.policyRef) || !has(self.policyRef.kind) || self.policyRef.kind
                    != ''PolicySet'''
              policyRef:
                description: policyRef identifies the permission definition.
                properties:
                  apiGroup:
                    description: |-
                      apiGroup is the referenced kind's API group. It is derived from kind when
                      omitted.
                    maxLength: 253
                    type: string
                  kind:
                    description: kind is Policy, PolicySet, Role, or ClusterRole.
                      Omission means Policy.
                    enum:
                    - Policy
                    - PolicySet
                    - Role
                    - ClusterRole
                    type: string
                  name:
                    description: name is the referenced permission definition's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace is the logical namespace of a namespaced definition. Omission
                      means the referencing document's namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  sourceRef:
                    description: sourceRef selects another allowed PolicySource.
                    properties:
                      name:
                        description: name is the PolicySource name.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: namespace is the PolicySource namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: apiGroup must match kind
                  rule: '!has(self.apiGroup) || self.apiGroup == (has(self.kind) &&
                    self.kind in [''Role'', ''ClusterRole''] ? ''rbac.authorization.k8s.io''
                    : ''authorization.zctx.io'')'
                - message: namespace is forbidden for ClusterRole
                  rule: '!(has(self.kind) && self.kind == ''ClusterRole'') || !has(self.namespace)'
                - message: a reference into another source requires namespace
                  rule: '!has(self.sourceRef) || has(self.namespace) || (has(self.kind)
                    && self.kind == ''ClusterRole'')'
              policySelector:
                description: |-
                  policySelector selects PolicySets by their labels and their namespaces'
                  labels. Each match is delegated to as a policyRef to it would be.
                properties:
                  namespaceSelector:
                    description: |-
                      namespaceSelector selects the namespaces whose PolicySets may match,
                      by the namespaces' labels in the source. An empty selector selects every
                      namespace; any other requires the source to collect namespace labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  selector:
                    description: selector selects PolicySets by their own labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  sourceRef:
                    description: |-
                      sourceRef selects another allowed PolicySource. Omission means the binding's
                      own source.
                    properties:
                      name:
                        description: name is the PolicySource name.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: namespace is the PolicySource namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - namespaceSelector
                - selector
                type: object
              subjectMatch:
                description: subjectMatch selects principals with extended fixed-form
                  predicates.
                properties:
                  requirements:
                    description: requirements are ANDed principal predicates.
                    items:
                      description: SubjectRequirement tests one principal attribute.
                        Requirements are ANDed.
                      properties:
                        key:
                          description: key is required only for Extra.
                          maxLength: 253
                          minLength: 1
                          type: string
                        kind:
                          description: kind selects the principal attribute.
                          enum:
                          - User
                          - Group
                          - ServiceAccount
                          - UID
                          - Extra
                          type: string
                        names:
                          description: names supplies operands for User, Group, or
                            ServiceAccount.
                          items:
                            minLength: 1
                            type: string
                          maxItems: 256
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        namespace:
                          description: namespace is required only for ServiceAccount.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        operator:
                          description: operator compares the selected values or tests
                            presence.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          - StartsWith
                          - NotStartsWith
                          type: string
                        values:
                          description: values supplies operands for UID or Extra.
                          items:
                            type: string
                          maxItems: 256
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - kind
                      - operator
                      type: object
                      x-kubernetes-validations:
                      - message: namespace is required only for ServiceAccount
                        rule: 'self.kind == ''ServiceAccount'' ? has(self.namespace)
                          : !has(self.namespace)'
                      - message: key is required only for Extra
                        rule: 'self.kind == ''Extra'' ? has(self.key) : !has(self.key)'
                      - message: identity requirements use names and attributes use
                          values
                        rule: 'self.kind in [''User'', ''Group'', ''ServiceAccount'']
                          ? !has(self.values) : !has(self.names)'
                      - message: prefix operators require identity names
                        rule: '!(self.operator in [''StartsWith'', ''NotStartsWith''])
                          || self.kind in [''User'', ''Group'', ''ServiceAccount'']'
                      - message: presence operators forbid operands and the other
                          operators require them
                        rule: 'self.operator in [''Exists'', ''DoesNotExist''] ? !has(self.names)
                          && !has(self.values) : has(self.names) || has(self.values)'
                      - message: UID values must not be empty
                        rule: self.kind != 'UID' || !has(self.values) || self.values.all(v,
                          size(v) > 0)
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              subjects:
                description: subjects contains exact principals combined by OR.
                items:
                  description: |-
                    Subject contains a reference to the object or user identities a role binding applies to.  This can either hold a direct API object reference,
                    or a value for non-objects such as user and group names.
                  properties:
                    apiGroup:
                      description: |-
                        apiGroup holds the API group of the referenced subject.
                        Defaults to "" for ServiceAccount subjects.
                        Defaults to "rbac.authorization.k8s.io" for User and Group subjects.
                      type: string
                    kind:
                      description: |-
                        kind of object being referenced. Values defined by this API group are "User", "Group", and "ServiceAccount".
                        If the Authorizer does not recognized the kind value, the Authorizer should report an error.
                      type: string
                    name:
                      description: name of the object being referenced.
                      type: string
                    namespace:
                      description: |-
                        namespace of the referenced object.  If the object kind is non-namespace, such as "User" or "Group", and this value is not empty
                        the Authorizer should report an error.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: subject kind must be User, Group, or ServiceAccount
                  rule: self.all(s, s.kind in ['User', 'Group', 'ServiceAccount'])
                - message: subject name must not be empty
                  rule: self.all(s, size(s.name) > 0)
                - message: a ServiceAccount subject requires namespace and no apiGroup;
                    User and Group subjects forbid namespace and use the rbac.authorization.k8s.io
                    apiGroup
                  rule: 'self.all(s, s.kind == ''ServiceAccount'' ? (has(s.namespace)
                    && size(s.namespace) > 0 && (!has(s.apiGroup) || s.apiGroup ==
                    '''')) : (!has(s.namespace) || s.namespace == '''') && (!has(s.apiGroup)
                    || s.apiGroup == ''rbac.authorization.k8s.io''))'
            type: object
            x-kubernetes-validations:
            - message: exactly one of subjects or subjectMatch is required
              rule: has(self.subjects) != has(self.subjectMatch)
            - message: exactly one of policyRef or policySelector is required
              rule: has(self.policyRef) != has(self.policySelector)
            - message: constraints.sourceRefs and constraints.maxDepth require a PolicySet
                target or a policySelector
              rule: '!has(self.constraints) || !(has(self.constraints.sourceRefs)
                || has(self.constraints.maxDepth)) || has(self.policySelector) ||
                (has(self.policyRef) && has(self.policyRef.kind) && self.policyRef.kind
                == ''PolicySet'')'
        required:
        - spec
        type: object
    served: true
    storage: true
