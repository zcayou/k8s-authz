# This patch mounts the management client certificate and CA the manager uses to authenticate to engines.

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-authz/management-certs
    name: management-certs
    readOnly: true

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-authz/management-ca
    name: management-ca
    readOnly: true

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --management-cert-path=/tmp/k8s-authz/management-certs

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --management-ca-path=/tmp/k8s-authz/management-ca/ca.crt

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: management-certs
    secret:
      secretName: management-client-cert
      optional: false
      items:
        - key: tls.crt
          path: tls.crt
        - key: tls.key
          path: tls.key

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: management-ca
    secret:
      secretName: management-ca
      optional: false
      items:
        - key: ca.crt
          path: ca.crt
