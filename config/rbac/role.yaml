---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - authorization.zctx.io
  resources:
  - authorizationservices
  - policysources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authorization.zctx.io
  resources:
  - authorizationservices/finalizers
  - policysources/finalizers
  verbs:
  - update
- apiGroups:
  - authorization.zctx.io
  resources:
  - authorizationservices/status
  - policysources/status
  verbs:
  - get
  - patch
  - update
