# This rule is not used by the project k8s-authz itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the authorization.zctx.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-authz
    app.kubernetes.io/managed-by: kustomize
  name: policyset-editor-role
rules:
- apiGroups:
  - authorization.zctx.io
  resources:
  - policysets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authorization.zctx.io
  resources:
  - policysets/status
  verbs:
  - get
