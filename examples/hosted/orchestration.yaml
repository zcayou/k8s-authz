apiVersion: authorization.zctx.io/v1alpha1
kind: PolicySet
metadata:
  namespace: elastic-system
  name: elk
spec:
  bindingRefs:
    - name: elk-admins
    - apiGroup: rbac.authorization.k8s.io
      kind: RoleBinding
      name: elk-viewers
    - apiGroup: rbac.authorization.k8s.io
      kind: RoleBinding
      namespace: confluent
      name: elk-viewers
    - name: application-team
---
apiVersion: authorization.zctx.io/v1alpha1
kind: Policy
metadata:
  namespace: elastic-system
  name: full-access
spec:
  include:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["*"]
---
apiVersion: authorization.zctx.io/v1alpha1
kind: PolicyBinding
metadata:
  namespace: elastic-system
  name: elk-admins
spec:
  subjects:
    - kind: Group
      name: "oidc:elk-a"
  policyRef:
    name: full-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: elastic-system
  name: elk-viewers
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: "oidc:elk-v"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: confluent
  name: elk-viewers
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: "oidc:elk-v"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-reader
---
apiVersion: authorization.zctx.io/v1alpha1
kind: Policy
metadata:
  namespace: elastic-system
  name: application-team-access
spec:
  include:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, watch]
      namespaces: [confluent]
---
apiVersion: authorization.zctx.io/v1alpha1
kind: PolicyBinding
metadata:
  namespace: elastic-system
  name: application-team
spec:
  subjectMatch: {}
  policyRef:
    kind: PolicySet
    namespace: confluent
    name: application-team
  constraints:
    policyRef:
      name: application-team-access
---
apiVersion: authorization.zctx.io/v1alpha1
kind: PolicySet
metadata:
  namespace: confluent
  name: application-team
spec:
  bindingRefs:
    - name: application-readers
---
apiVersion: authorization.zctx.io/v1alpha1
kind: PolicyBinding
metadata:
  namespace: confluent
  name: application-readers
spec:
  subjects:
    - kind: Group
      name: "oidc:elk-app-r"
  policyRef:
    namespace: elastic-system
    name: full-access
